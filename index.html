<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocIntel – Resume Intelligence</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#0d0d0d;--line:#2a2a2a;--tx:#f5f5f5;--mut:#9a9a9a;--a:#a78bfa;--b:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{padding:36px 20px 20px;text-align:center}h1{margin:0;font-size:clamp(26px,5vw,40px);background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin:6px 0 0}
main{max-width:1100px;margin:0 auto;padding:0 16px 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
#drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;cursor:pointer;transition:.2s}
#drop:hover,#drop.on{border-color:var(--a);background:rgba(255,255,255,.05)}
label.o{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{padding:6px 12px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:13px}
.chips input{display:none}.chips input:checked+span{color:var(--b);font-weight:600}.chips label:has(input:checked){border-color:var(--b);background:rgba(34,211,238,.1)}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b))}
button:disabled{opacity:.6;cursor:wait}
.err{background:rgba(248,113,113,.12);border:1px solid var(--bad);color:var(--bad);padding:12px;border-radius:12px}
.warn{background:rgba(251,191,36,.1);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:10px;font-size:13px;margin-top:8px}
.ring{--p:0;width:140px;height:140px;border-radius:50%;margin:auto;display:grid;place-items:center;background:conic-gradient(var(--c,var(--ok)) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px;font-weight:700}
.pill{display:inline-block;padding:4px 11px;margin:3px;border-radius:99px;background:rgba(255,255,255,.1);font-size:13px}
.miss{background:rgba(248,113,113,.15);color:var(--bad)}.unc{background:rgba(251,191,36,.15);color:var(--warn)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.bar span:first-child{width:110px;color:var(--mut)}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s}
.row{padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border:0}.row small{color:var(--mut)}
pre{background:var(--bg);padding:14px;border-radius:12px;overflow:auto;font-size:12px;max-height:320px}
.null{color:var(--bad);font-style:italic}ul{padding-left:20px;margin:0}.hide{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<header><h1>📄 DocIntel</h1><p>AI-powered resume intelligence — summarise, extract, validate, visualise</p></header>
<main>
<section class="card"><div class="grid">
 <div><h2> Document</h2>
  <div id="drop"><div id="dt">📁 Drag &amp; drop a PDF/TXT here, or click to browse</div><input id="file" type="file" accept=".pdf,.txt" hidden></div>
  </div>
 <div><h2> Extra Features</h2>
  <label class="o">Summary style</label><select id="style"><option value="brief">Brief</option><option value="detailed">Detailed</option><option value="bullets">Bullet points</option></select>
  <label class="o">Analysis level</label><select id="level"><option value="basic">Basic</option><option value="standard" selected>Standard</option><option value="detailed">Detailed</option></select>
  <label class="o">Engine</label><select id="engine"><option value="auto">Auto (Gemini → local fallback)</option><option value="local">Local ML/NLP only (no API)</option><option value="gemini">Gemini only</option></select>
  <label class="o">Focus fields (optional – overrides level)</label>
  <div class="chips" id="focus"></div></div></div>
 <button id="go">Analyse document</button></section>
<div id="msg"></div>
<div id="res" class="hide">
 <div class="grid">
  <section class="card"><h2>Completeness</h2><div class="ring" id="ring"><div id="pct">0%</div></div><p id="cinfo" style="text-align:center;color:var(--mut)"></p><div id="flags" style="text-align:center"></div></section>
  <section class="card"><h2>Summary</h2><div id="sum" style="white-space:pre-line"></div><h2 style="margin-top:16px">Key findings</h2><ul id="kf"></ul></section>
 </div>
 <div class="grid" style="margin-top:18px">
  <section class="card"><h2>Visual insight · Skills by category</h2><div id="chart"></div><div id="skills"></div></section>
  <section class="card"><h2>Extracted information</h2><div id="ext"></div></section>
 </div>
 <section class="card" style="margin-top:18px"><h2>Structured JSON</h2><pre id="json"></pre></section>
</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIELDS=['name','email','phone','skills','education','experience'];
$('focus').innerHTML=FIELDS.map(f=>`<label><input type="checkbox" value="${f}"><span>${f}</span></label>`).join('');
let file=null;
const setFile=f=>{file=f;$('dt').textContent=f?'✅ '+f.name:'📁 Drag & drop a PDF/TXT here, or click to browse'};
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>setFile(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');setFile(e.dataTransfer.files[0])};
$('go').onclick=async()=>{
 $('msg').innerHTML='';
 if(!file){$('msg').innerHTML='<div class="err">Please upload a PDF or TXT file.</div>';return}
 const fd=new FormData();if(file)fd.append('file',file);
 fd.append('style',$('style').value);fd.append('level',$('level').value);fd.append('engine',$('engine').value);
 fd.append('focus',JSON.stringify([...document.querySelectorAll('#focus input:checked')].map(i=>i.value)));
 $('go').disabled=true;$('go').innerHTML='<span class="spin"></span>Analysing…';
 try{const r=await fetch('/api/analyze',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');render(d)}
 catch(e){$('msg').innerHTML=`<div class="err">⚠️ ${esc(e.message)}</div>`;$('res').classList.add('hide')}
 $('go').disabled=false;$('go').textContent='Analyse document'};
function render(d){
 $('res').classList.remove('hide');const x=d.extracted;
 $('ring').style.setProperty('--p',d.completeness);$('ring').style.setProperty('--c',d.completeness>=80?'var(--ok)':d.completeness>=50?'var(--warn)':'var(--bad)');
 $('pct').textContent=d.completeness+'%';$('cinfo').textContent=`Engine: ${d.engine==='local'?'Local ML/NLP':'Gemini'} · Level: ${d.level} · ${d.fields.length-d.missing.length}/${d.fields.length} fields found`;
 $('flags').innerHTML=d.missing.map(m=>`<span class="pill miss">missing: ${esc(m)}</span>`).join('')+d.uncertain.map(m=>`<span class="pill unc">uncertain: ${esc(m)}</span>`).join('')+d.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('');
 $('sum').textContent=d.summary;$('kf').innerHTML=d.key_findings.map(k=>`<li>${esc(k)}</li>`).join('');
 const nul='<span class="null">not found (null)</span>';
 let h='';
 for(const f of ['name','email','phone'])if(d.fields.includes(f))h+=`<div class="row"><small>${f}</small><br>${x[f]?esc(x[f]):nul}</div>`;
 if(d.fields.includes('education'))h+=`<div class="row"><small>education</small>${x.education?x.education.map(e=>`<br>🎓 <b>${esc(e.degree||'—')}</b> · ${esc(e.institution||'—')} ${e.year?'('+esc(e.year)+')':''}`).join(''):'<br>'+nul}</div>`;
 if(d.fields.includes('experience'))h+=`<div class="row"><small>experience</small>${x.experience?x.experience.map(e=>`<br>💼 <b>${esc(e.title||'—')}</b> · ${esc(e.company||'—')} ${e.duration?'('+esc(e.duration)+')':''}${e.description?'<br><small>'+esc(e.description)+'</small>':''}`).join('<br>'):'<br>'+nul}</div>`;
 $('ext').innerHTML=h;
 const sk=x.skills||[];const cats={};sk.forEach(s=>cats[s.category]=(cats[s.category]||0)+1);const mx=Math.max(1,...Object.values(cats));
 $('chart').innerHTML=sk.length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="bar"><span>${esc(c)}</span><i style="width:${n/mx*60}%"></i><b>${n}</b></div>`).join(''):(d.fields.includes('skills')?'<p class="null">No skills found.</p>':'<p style="color:var(--mut)">Skills not selected.</p>');
 $('skills').innerHTML=sk.map(s=>`<span class="pill">${esc(s.name)}</span>`).join('');
 $('json').textContent=JSON.stringify({summary:d.summary,key_findings:d.key_findings,extracted:x,completeness:d.completeness,missing:d.missing},null,2);
 $('res').scrollIntoView({behavior:'smooth'})}
</script></body></html>
